<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=Reem+Kufi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#e9dcc8;font-family:Manrope,sans-serif;color:#2b1a10}
.house{position:absolute;left:220px;right:220px;top:0;bottom:0;background:#6a3b1d;border-left:14px solid #fffcf7;border-right:14px solid #fffcf7}
.trim{height:14px;background:repeating-linear-gradient(90deg,#fffcf7 0 10px,transparent 10px 14px),#fffcf7}
.zig{height:12px;background:linear-gradient(135deg,#6a3b1d 25%,transparent 25%) 0 0/16px 12px,linear-gradient(225deg,#6a3b1d 25%,transparent 25%) 0 0/16px 12px,#fffcf7}
.top{height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fffcf7}
.fan{width:300px;height:110px;border-radius:150px 150px 0 0;border:8px solid #fffcf7;border-bottom:0;background:conic-gradient(from 270deg at 50% 100%,#8e2328 0 30deg,#c9971f 30deg 60deg,#3f6b45 60deg 90deg,#c9971f 90deg 120deg,#8e2328 120deg 150deg,#3f6b45 150deg 180deg)}
.name{font-family:Marcellus,serif;font-size:58px;margin-top:18px}
.ar{font-family:'Reem Kufi',serif;color:#c9971f;font-size:30px}
.mid{height:210px;display:flex;justify-content:space-around;align-items:center;padding:0 60px}
.win{width:150px;height:150px;border:8px solid #fffcf7;border-radius:75px 75px 0 0;display:flex;align-items:center;justify-content:center;color:#fffcf7;font-size:17px;font-weight:600;background:rgba(43,26,16,.35)}
.ground{height:300px;display:flex;justify-content:center;align-items:flex-end;gap:60px;padding-bottom:0}
.door{width:220px;height:240px;background:#3a2215;border:10px solid #fffcf7;border-bottom:0;border-radius:110px 110px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fffcf7;text-align:center;gap:8px}
.door b{font-family:Marcellus,serif;font-weight:400;font-size:28px}
.door span{font-size:14px;opacity:.85}
.staff{width:110px;height:150px;background:#2b1a10;border:6px solid #fffcf7;border-bottom:0;display:flex;align-items:center;justify-content:center;color:#f6eee3;font-size:13px;font-weight:700;text-align:center;padding:8px}
.street{position:absolute;left:0;right:0;bottom:0;height:16px;background:#cbb59b}
.side{position:absolute;top:120px;width:200px;font-size:15px;line-height:1.6;color:#4a3324}
.side h3{font-family:Marcellus,serif;font-weight:400;font-size:24px;color:#2b1a10;margin-bottom:6px}
</style></head><body>
<div class="side" style="left:16px">
<h3>Hours</h3>Tue to Fri 6:30 to 3<br>Sat and Sun 7 to 2<br>Closed Monday</div>
<div class="side" style="right:4px">
<h3>Order by text</h3>(206) 555-0142<br>On the Ave, Seattle</div>
<div class="house">
<div class="trim"></div>
<div class="top"><div class="fan"></div><div class="name">Mokha Coffee House</div><div class="ar">قهوة المخا</div></div>
<div class="zig"></div>
<div class="mid"><div class="win">Menu</div><div class="win">Our coffee</div><div class="win">Visit</div><div class="win">Catering</div></div>
<div class="zig"></div>
<div class="ground"><div class="door"><b>Order by text</b><span>Haraz coffee, Adeni chai,<br>milk cake</span></div><div class="staff">Back of House view →</div></div>
</div>
<div class="street"></div>
</body></html>
